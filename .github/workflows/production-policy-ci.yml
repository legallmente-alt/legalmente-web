name: Production and release integration CI

on:
  pull_request:
    paths:
      - 'src/lib/production-policy/**'
      - 'src/lib/visual-factory/**'
      - 'src/lib/production-learning/**'
      - 'src/lib/production-runtime/**'
      - 'src/lib/release-readiness/**'
      - 'src/lib/editorial-engine/**'
      - 'src/app/terminos/**'
      - 'src/app/privacidad/**'
      - 'src/app/disclosure/**'
      - 'src/app/sitemap.ts'
      - 'src/components/LegalDocument.tsx'
      - 'src/components/LegalScopeNotice.tsx'
      - 'src/components/Footer.tsx'
      - 'scripts/legal-surface-smoke.mjs'
      - 'scripts/social-content-contract-smoke.mjs'
      - 'scripts/public-route-proof.mjs'
      - 'package.json'
      - '.github/workflows/production-policy-ci.yml'
  push:
    paths:
      - 'src/lib/production-policy/**'
      - 'src/lib/visual-factory/**'
      - 'src/lib/production-learning/**'
      - 'src/lib/production-runtime/**'
      - 'src/lib/release-readiness/**'
      - 'src/lib/editorial-engine/**'
      - 'src/app/terminos/**'
      - 'src/app/privacidad/**'
      - 'src/app/disclosure/**'
      - 'src/app/sitemap.ts'
      - 'src/components/LegalDocument.tsx'
      - 'src/components/LegalScopeNotice.tsx'
      - 'src/components/Footer.tsx'
      - 'scripts/legal-surface-smoke.mjs'
      - 'scripts/social-content-contract-smoke.mjs'
      - 'scripts/public-route-proof.mjs'
      - 'package.json'
      - '.github/workflows/production-policy-ci.yml'

jobs:
  release-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Convergence contracts
        run: npm run test:convergence
      - name: Public legal surface contract
        run: npm run test:legal-surface
      - name: Social content contract
        run: npm run test:social-content
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
