name: LegalMente product core CI

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/lib/legal-core/**'
      - 'src/lib/visual-system/**'
      - 'src/lib/knowledge-graph/**'
      - 'src/lib/editorial-engine/**'
      - 'src/lib/contracts/**'
      - 'src/components/**'
      - 'public/assets/legalmente/**'
      - 'public/_headers'
      - 'public/robots.txt'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/legal-core-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/lib/legal-core/**'
      - 'src/lib/visual-system/**'
      - 'src/lib/knowledge-graph/**'
      - 'src/lib/editorial-engine/**'
      - 'src/lib/contracts/**'
      - 'src/components/**'
      - 'public/assets/legalmente/**'
      - 'public/_headers'
      - 'public/robots.txt'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - '.github/workflows/legal-core-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run test:legal-core
      - run: npm run test:knowledge-safety
      - run: npm run test:knowledge-integrity
      - run: npm run test:ecosystem-kernel
      - run: npm run test:agent-contribution
      - run: npm run test:editorial-engine
      - run: npm run typecheck
      - run: npm run lint
      - name: Privacy surface smoke
        run: node scripts/privacy-surface-smoke.mjs
      - name: Build sanitized public artifact
        run: npm run build:public
      - name: Public artifact fail-closed checks
        run: |
          test -f out/_headers
          test -f out/robots.txt
          test ! -e out/internal
          grep -q 'Disallow: /internal/' out/robots.txt
      - name: Public route and discovery proof
        run: npm run test:public-routes
      - name: Upload sanitized public artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legalmente-public-artifact-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Install proof browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Capture responsive proofs and accessibility smoke
        run: |
          python3 -m http.server 3000 --directory out > /tmp/legalmente-static.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/legalmente-static.log
            exit 1
          fi

          node scripts/capture-implementation-proofs.mjs
          node scripts/accessibility-interaction-smoke.mjs
      - name: Upload integrated proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legalmente-public-proofs-${{ github.sha }}
          path: implementation-proofs/
          if-no-files-found: warn
          retention-days: 14