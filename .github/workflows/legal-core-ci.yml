name: LegalMente legal core CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/legal-core/**'
      - 'src/lib/visual-system/**'
      - 'src/components/legalmente/**'
      - 'package.json'
      - '.github/workflows/legal-core-ci.yml'
  push:
    branches:
      - main
      - feat/legalmente-deterministic-product-core-v1
    paths:
      - 'src/lib/legal-core/**'
      - 'src/lib/visual-system/**'
      - 'src/components/legalmente/**'
      - 'package.json'
      - '.github/workflows/legal-core-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run test:legal-core
      - run: npm run typecheck
      - run: npm run build
